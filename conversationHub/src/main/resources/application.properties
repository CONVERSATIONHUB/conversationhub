spring.application.name=conversationHub
spring.datasource.url=jdbc:mysql://localhost:3306/conversation_hub
spring.datasource.username=root
spring.datasource.password=Tyson@2525
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
# schema.sql is idempotent: it creates missing tables, adds missing columns and updates enum/type
# definitions on the original release-1 database before Hibernate validates the final structure.
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8

booking.expiry.scan-ms=60000


app.default-language=EN
app.audit.retention-days=365
app.audit.cleanup-scan-ms=86400000
app.security.session-timeout-minutes=30
# Enable in production when TLS is available (directly or via a trusted reverse proxy).
# Disabled locally so plain HTTP development on port 8080 works.
app.security.require-https=false
app.verification.code-ttl-minutes=30
app.verification.max-attempts=5
app.password-reset.ttl-minutes=30
server.servlet.session-timeout=${app.security.session-timeout-minutes:30}m
app.catalog.services[0].category=INSTITUTIONAL
app.catalog.services[0].service-type=Institutional appointment
app.catalog.services[0].duration-minutes=30
